name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            name: darwin-arm64
            ext: ""
            archive: tar.gz
          - target: bun-linux-x64
            name: linux-x64
            ext: ""
            archive: tar.gz
          - target: bun-linux-arm64
            name: linux-arm64
            ext: ""
            archive: tar.gz
          - target: bun-windows-x64
            name: windows-x64
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Build ${{ matrix.name }}
        run: |
          mkdir -p "dist/davy-${{ matrix.name }}"
          bun build --compile --target=${{ matrix.target }} index.ts \
            --outfile "dist/davy-${{ matrix.name }}/davy${{ matrix.ext }}"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        working-directory: dist
        run: tar -czf "davy-${{ matrix.name }}.tar.gz" "davy-${{ matrix.name }}"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        working-directory: dist
        run: zip -r "davy-${{ matrix.name }}.zip" "davy-${{ matrix.name }}"

      - name: Checksum
        working-directory: dist
        run: sha256sum "davy-${{ matrix.name }}.${{ matrix.archive }}" > "davy-${{ matrix.name }}.${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: davy-${{ matrix.name }}
          path: |
            dist/davy-${{ matrix.name }}.${{ matrix.archive }}
            dist/davy-${{ matrix.name }}.${{ matrix.archive }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          generate_release_notes: true
